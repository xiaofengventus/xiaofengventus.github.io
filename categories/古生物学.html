<script>
  (function() {
    function initTimeline() {
      // 从页面源码读取 front-matter（最可靠）
      const source = document.documentElement.outerHTML;
      const epochMatch = source.match(/epoch:\s*([^\r\n]+)/i);
      const posMatch = source.match(/timeline_position:\s*([^\r\n]+)/i);
      const modeMatch = source.match(/timeline_mode:\s*([^\r\n]+)/i);

      const currentEpoch = epochMatch ? epochMatch[1].trim() : '';
      const position = posMatch ? posMatch[1].trim().toLowerCase() : 'center';
      const mode = modeMatch ? modeMatch[1].trim() : 'simple';

      if (!currentEpoch) {
        console.log('%c【时间轴】未设置 epoch 字段', 'color:#ff6b6b');
        return;
      }

      console.log('%c【时间轴】当前纪元：' + currentEpoch + ' | 位置：' + position, 'color:#41b883');

      const target = document.querySelector('.post-meta') || document.querySelector('.post-title')?.parentElement;
      if (!target || document.querySelector('.global-evolution-timeline')) return;

      // 详细分期数据（可继续扩展）
      const epochs = mode === 'detailed' ? [
        { name: '冥古宙', label: 'Hadean' },
        { name: '太古宙', label: 'Archean' },
        { name: '元古宙', label: 'Proterozoic' },
        { name: '寒武纪', label: 'Cambrian' },
        { name: '奥陶纪', label: 'Ordovician' },
        { name: '志留纪', label: 'Silurian' },
        { name: '泥盆纪', label: 'Devonian' },
        { name: '石炭纪', label: 'Carboniferous' },
        { name: '二叠纪', label: 'Permian' },
        { name: '三叠纪', label: 'Triassic' },
        { name: '侏罗纪', label: 'Jurassic' },
        { name: '白垩纪', label: 'Cretaceous' },
        { name: '古近纪', label: 'Paleogene' },
        { name: '新近纪', label: 'Neogene' },
        { name: '第四纪', label: 'Quaternary' }
      ] : [
        { name: '冥古宙', label: 'Hadean' },
        { name: '太古宙', label: 'Archean' },
        { name: '元古宙', label: 'Proterozoic' },
        { name: '寒武纪', label: 'Cambrian' },
        { name: '奥陶纪', label: 'Ordovician' },
        { name: '志留纪', label: 'Silurian' },
        { name: '泥盆纪', label: 'Devonian' },
        { name: '石炭纪', label: 'Carboniferous' },
        { name: '二叠纪', label: 'Permian' },
        { name: '中生代', label: 'Mesozoic' },
        { name: '新生代', label: 'Cenozoic' }
      ];

      let html = `<div class="global-evolution-timeline"><div class="timeline-scroll-container ${position === 'left' || position === 'right' ? 'vertical' : ''}">`;

      epochs.forEach((ep, i) => {
        const active = (ep.name === currentEpoch) ? ' active' : '';
        html += `<div class="timeline-node-item${active}"><div class="node-dot"></div><div><div class="node-name">${ep.name}</div><div class="node-label">${ep.label}</div></div></div>`;
        if (i < epochs.length - 1) html += '<div class="timeline-connector-line"></div>';
      });

      html += '</div></div>';

      target.insertAdjacentHTML('afterend', html);
    }

    setTimeout(initTimeline, 700);
    document.addEventListener('pjax:complete', () => setTimeout(initTimeline, 500));
  })();
</script>
