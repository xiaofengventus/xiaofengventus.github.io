  (function(){
    // 1. 创建倒计时容器
    var countdownEl = document.createElement('div');
    countdownEl.id = 'custom-countdown';
    countdownEl.innerHTML = '正在初始化...';

    // 2. 目标：把倒计时塞进大图中间的 site-info 区域
    function injectCountdown() {
      var siteInfo = document.querySelector('#site-info');
      if (siteInfo && !document.getElementById('custom-countdown')) {
        siteInfo.appendChild(countdownEl);
      }
    }

    // 3. 计算逻辑
    var end = new Date('2026/08/01 00:00:00').getTime(); 
    function update() {
      var now = new Date().getTime();
      var t = end - now;
      if (t > 0) {
        var d = Math.floor(t / 86400000);
        var h = Math.floor((t / 3600000) % 24);
        var m = Math.floor((t / 60000) % 60);
        var s = Math.floor((t / 1000) % 60);
        countdownEl.innerHTML = "🏁 距离 ACM 集训还剩: " + d + "天 " + h + "时 " + m + "分 " + s + "秒";
      } else {
        countdownEl.innerHTML = "🚀 集训已开启！加油！";
      }
    }

    // 执行注入和更新
    setInterval(update, 1000);
    // 延迟一点点注入，确保页面元素加载完了
    setTimeout(injectCountdown, 500); 
    // 针对 PJAX（切换页面不刷新）的适配
    document.addEventListener('pjax:complete', injectCountdown);
  })();
</script>
